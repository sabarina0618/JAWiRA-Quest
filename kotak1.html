<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piramid Hijaiyyah</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><main class="container"><div class="topbar"><button onclick="location.href='index.html'">🏠 Utama</button></div><section class="hero"><div class="wood"><h1>🔺 Piramid Hijaiyyah</h1><p>28 huruf lengkap dari Alif hingga Ya</p></div></section><div class="paper"><div id="pyramid" class="letters"></div><div class="note">💡 Klik huruf untuk mendengar nama huruf. Baca secara tersusun dan latih sebutan bersama guru.</div></div></main></div><script src="script.js"></script><script>
const letters=[["ا","Alif"],["ب","Ba"],["ت","Ta"],["ث","Tha"],["ج","Jim"],["ح","Ha"],["خ","Kha"],["د","Dal"],["ذ","Dzal"],["ر","Ra"],["ز","Zai"],["س","Sin"],["ش","Syin"],["ص","Sad"],["ض","Dad"],["ط","Ta"],["ظ","Za"],["ع","Ain"],["غ","Ghain"],["ف","Fa"],["ق","Qaf"],["ک","Kaf"],["ل","Lam"],["م","Mim"],["ن","Nun"],["و","Wau"],["ه","Ha"],["ي","Ya"]];
document.getElementById("pyramid").innerHTML=letters.map(x=>`<button class="letter" onclick="speakName('${x[1]}')">${x[0]}</button>`).join("");
function speakName(t){if("speechSynthesis" in window){let u=new SpeechSynthesisUtterance(t);u.lang="ms-MY";speechSynthesis.speak(u)}}
</script></body></html>
